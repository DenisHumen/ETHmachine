{% extends "base.html" %}
{% block title %}First-time setup — ETHmachine{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="glitch" data-text="// REGISTER ROOT">// REGISTER ROOT</h1>
  <p class="hint">Это первая настройка. Создаваемый пользователь получит роль <b>root</b>.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="auth-form">
    <label>Username (3–64 символа)
      <input name="username" autofocus required minlength="3" maxlength="64" pattern="[A-Za-z0-9_.\-]+">
    </label>
    <label>Password (мин. 8 символов)
      <input name="password" type="password" required minlength="8" maxlength="200">
    </label>
    <label>Подтвердите пароль
      <input name="password2" type="password" required minlength="8" maxlength="200">
    </label>
    <button type="submit" class="primary">CREATE ROOT ►</button>
  </form>
</div>
{% endblock %}
