[package]
name = "eth_nice_address"
version = "1.0.0"
edition = "2021"
authors = ["ETHmachine"]

[[bin]]
name = "eth_nice_address"
path = "src/main.rs"

[dependencies]
# BIP39 mnemonic generation
bip39 = "2.0"
# Ethereum libraries
tiny-keccak = { version = "2.0", features = ["keccak"] }
secp256k1 = { version = "0.28", features = ["rand-std", "recovery"] }
# Cryptography
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CSV writing
csv = "1.3"
# Command line args
clap = { version = "4.5", features = ["derive"] }
# Progress bar
indicatif = "0.17"
# Colored output
colored = "2.1"
# Random number generation
rand = "0.8"
# Multi-threading
rayon = "1.8"
# Atomic operations for counters
crossbeam = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
